name: Check M3U Playlist

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions
  schedule:
    - cron: '0 0 * * *' # Otomatis berjalan setiap jam 00:00 UTC (opsional)

jobs:
  check-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Checker Script
        run: python check_m3u.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add live_channels.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live channels list [skip ci]" && git push)
