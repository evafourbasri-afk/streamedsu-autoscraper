name: DAM M3U8 Generator

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DAM_BASE_URL: ${{ secrets.DAM_BASE_URL }}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright "httpx[http2]" pytz "adblock>=0.6.0"

      - name: Run DAM updater
        run: |
          python dam.py
        env:
          DAM_BASE_URL: ${{ secrets.DAM_BASE_URL }}          

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dam_vlc.m3u8 dam_tivimate.m3u8 || true
          git diff --staged --quiet || git commit -m "Update DAM M3U8 files [skip ci]"
          git push
