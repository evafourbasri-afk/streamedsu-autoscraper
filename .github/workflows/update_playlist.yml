name: Format M3U Logos

on:
  push:
    paths:
      - 'playlist.m3u'
  workflow_dispatch:

jobs:
  process-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow rembg[cli]

      - name: Run Logo Processor
        run: python process_m3u.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add logos/ playlist.m3u
          git commit -m "Auto-format logos and update M3U [skip ci]" || echo "No changes to commit"
          git push
